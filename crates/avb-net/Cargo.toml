[package]
name = "avb-net"
description = "Raw Ethernet for AVB protocols: raw-ether's interfaces, sockets, hardware time stamps and clocks, and AVTP stream frames"
version = "0.1.5"
categories = ["network-programming", "no-std"]
keywords = ["avb", "tsn", "ethernet", "raw-socket"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true

[lints]
workspace = true

[features]
default = ["std"]
# Interfaces and frame I/O on Linux, macOS and Windows. Without it only the
# address types remain, for protocol crates built for microcontrollers.
std = ["raw-ether/std", "dep:libc"]

[dependencies]
# In gptp's repository, scrambletools/gptp.
raw-ether = { version = "0.1.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "0.2", optional = true }

[[example]]
name = "listen"
required-features = ["std"]
