[package]
name = "avb-stream"
description = "AVTP audio streams: AAF and AM824 talkers and listeners paced on gPTP time, CRF media clocks, with audio through cpal"
version = "0.1.0"
categories = ["network-programming", "multimedia::audio"]
keywords = ["avb", "avtp", "aaf", "milan", "1722"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
atdecc.workspace = true
avb-net = { workspace = true, features = ["std"] }
cpal = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
